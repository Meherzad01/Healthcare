<div class="container">
    <h2>Task 4: Patient Age and Appointment Data Using Arrays</h2>
    <pre class="output" id="output"></pre>

    <script>
        function print(message) {
            console.log(message);
            document.getElementById("output").textContent += message + "\n";
        }

        let patientAges = [22, 35, 67, 45, 29, 72, 56, 18, 64, 40];

        // 1. Display all ages (for loop)
        function displayAges(arr) {
            print("All patient ages:");
            for (let i = 0; i < arr.length; i++) {
                print("  Patient " + (i + 1) + ": " + arr[i]);
            }
        }

        // 2. Minimum age (manual loop)
        function findMin(arr) {
            let min = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] < min) min = arr[i];
            }
            return min;
        }

        // 3. Maximum age (Math.max with spread)
        function findMax(arr) {
            return Math.max(...arr);
        }

        // 4. Average age (reduce)
        function findAverage(arr) {
            let sum = arr.reduce(function (total, age) { return total + age; }, 0);
            return sum / arr.length;
        }

        // 5. Senior citizens (age >= 60)
        function countSeniors(arr) {
            let count = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] >= 60) count++;
            }
            return count;
        }

        // 6. Patients below 18 (filter)
        function countBelow18(arr) {
            return arr.filter(function (age) { return age < 18; }).length;
        }

        // 7. Patients older than 60 (filter)
        function ageAbove60(arr) {
            return arr.filter(function (age) { return age > 60; });
        }

        // ---------- Run ----------
        displayAges(patientAges);
        print("");
        print("Minimum age: " + findMin(patientAges));
        print("Maximum age: " + findMax(patientAges));
        print("Average age: " + findAverage(patientAges).toFixed(2));
        print("Senior citizens (60+): " + countSeniors(patientAges));
        print("Patients below 18: " + countBelow18(patientAges));
        print("Patients older than 60: " + ageAbove60(patientAges).join(", "));
    </script>
