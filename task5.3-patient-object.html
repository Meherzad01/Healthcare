<div class="container">
    <h2>Task 3: JavaScript Object for Patient Registration</h2>
    <pre class="output" id="output"></pre>

    <script>
        // Helper: prints to console AND on the page
        function print(message) {
            console.log(message);
            document.getElementById("output").textContent += message + "\n";
        }

        // ---------- Patient object ----------
        let patient = {
            patientName: "Rahul Sharma",
            patientId: "PAT-1001",
            age: 45,
            gender: "Male",
            bloodGroup: "B+",
            mobile: "9876543210",
            department: "Cardiology",
            appointmentType: "Consultation",
            registrationStatus: "Confirmed",

            // Method 1: complete patient information
            displayPatient: function () {
                print("----- Patient Information -----");
                print("Name: " + this.patientName);
                print("Patient ID: " + this.patientId);
                print("Age: " + this.age);
                print("Gender: " + this.gender);
                print("Blood Group: " + this.bloodGroup);
                print("Mobile: " + this.mobile);
                print("Department: " + this.department);
                print("Appointment Type: " + this.appointmentType);
                print("Registration Status: " + this.registrationStatus);
            },

            // Method 2: appointment information
            displayAppointment: function () {
                print("----- Appointment Information -----");
                print("Patient: " + this.patientName + " (" + this.patientId + ")");
                print("Department: " + this.department);
                print("Appointment Type: " + this.appointmentType);
                print("Status: " + this.registrationStatus);
            },

            // Method 3: adult or senior citizen
            checkAgeCategory: function () {
                let category;
                if (this.age >= 60) {
                    category = "Senior Citizen";
                } else if (this.age >= 18) {
                    category = "Adult";
                } else {
                    category = "Minor";
                }
                print("----- Age Category -----");
                print(this.patientName + " is classified as: " + category);
                return category;
            }
        };

        // ---------- Calling the methods ----------
        patient.displayPatient();
        patient.displayAppointment();
        patient.checkAgeCategory();

        // Modify a property and call the method again
        patient.age = 65;
        print("(After changing age to 65)");
        patient.checkAgeCategory();
    </script>
