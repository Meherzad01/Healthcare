<div class="container">
    <h2>Task 1: Patient Information and Registration Fee Calculation</h2>
    <script>
        // ---------- 1. Variables (different data types) ----------
        var patientName     = "Rahul Sharma";   // string
        var patientId       = "PAT-1001";       // string
        var patientAge      = 65;               // number
        var consultationFee = 500;              // number
        var registrationFee = 100;              // number

        // To accept input from the user instead, use e.g.:
        // var patientName = prompt("Enter patient name:");
        // var patientAge  = Number(prompt("Enter patient age:"));

        // ---------- 2. Operators and expressions ----------
        var subtotal = consultationFee + registrationFee;   // arithmetic
        var discount = 0;
        var isSenior = patientAge >= 60;                     // relational -> boolean
        var registrationStatus = "Registered";

        if (isSenior) {                                      // basic if statement
            discount = subtotal * 0.10;                      // 10% senior-citizen discount
            registrationStatus = "Registered (Senior Citizen Discount Applied)";
        }

        var totalAmount = subtotal - discount;

        // ---------- 3. Message-printing methods ----------
        // console.log() -> browser console (F12)
        console.log("Patient Name: " + patientName);
        console.log("Patient ID: " + patientId);
        console.log("Total Amount: Rs. " + totalAmount);
        console.log("Registration Status: " + registrationStatus);

        // document.write() -> prints on the web page (at this position)
        var report =
            "<div class='info-card'>" +
            "<p><strong>Patient Name:</strong> " + patientName + "</p>" +
            "<p><strong>Patient ID:</strong> " + patientId + "</p>" +
            "<p><strong>Age:</strong> " + patientAge + "</p>" +
            "<p><strong>Subtotal (Consultation + Registration):</strong> &#8377; " + subtotal.toFixed(2) + "</p>" +
            "<p><strong>Senior Discount:</strong> &#8377; " + discount.toFixed(2) + "</p>" +
            "<p><strong>Total Amount Payable:</strong> &#8377; " + totalAmount.toFixed(2) + "</p>" +
            "<p><strong>Registration Status:</strong> " + registrationStatus + "</p>" +
            "</div>";
        document.write(report);

        // alert() -> popup box
        alert("Patient: " + patientName + "\nID: " + patientId +
              "\nTotal Amount: Rs. " + totalAmount.toFixed(2) +
              "\nStatus: " + registrationStatus);
    </script>
